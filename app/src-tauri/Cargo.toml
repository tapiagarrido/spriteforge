[package]
name = "forja-sprites"
version = "0.38.1"
description = "Boceto -> sprites pixel art, en local"
authors = ["Gustavo Garrido"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
